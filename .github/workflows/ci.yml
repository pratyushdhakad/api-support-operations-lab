name: Quality checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Compile source
        run: python -m compileall -q src tests

      - name: Run complete deterministic pipeline
        run: make pipeline

      - name: Fail on generated-output drift
        run: git diff --exit-code -- artifacts site/data/dashboard.json

      - name: Check whitespace
        run: git diff --check
